services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft-server
    restart: unless-stopped
    ports:
      - "25565:25565"
    environment:
      # Acepta el EULA de Mojang (obligatorio)
      EULA: "TRUE"

      # Tipo de servidor: VANILLA, PAPER, SPIGOT, FABRIC, FORGE
      TYPE: "PAPER"

      # Versión fija del juego (para compatibilidad con plugins)
      VERSION: "1.21.11"

      # Recursos de la JVM
      MEMORY: "2G"

      # ─── Plugins automáticos ───────────────────────────────────
      # Descarga automática de plugins desde Modrinth (por slug)
      #   - EssentialsX: essentialsx
      #   - LuckPerms: luckperms
      MODRINTH_PROJECTS: "essentialsx,luckperms,xaero-map-spigot"

      # Descarga automática de plugins por URL directa (GitHub Releases, etc.)
      #   - Vault 1.7.3: API de permisos y economía
      PLUGINS: "https://github.com/MilkBowl/Vault/releases/download/1.7.3/Vault.jar"

      # Copia plugins personalizados desde /plugins (bind mount) a /data/plugins
      COPY_PLUGINS_DEST: "/data/plugins"

      # ─── Configuración básica del servidor ─────────────────────
      DIFFICULTY: "normal" # peaceful, easy, normal, hard
      MODE: "survival" # survival, creative, adventure, spectator
      MAX_PLAYERS: "5"
      MOTD: "Tilin Server - ¡Bienvenidos a la aventura!" # Mensaje del día
      ONLINE_MODE: "false" # false = modo offline (sin auth de Mojang)
      ALLOW_NETHER: "true"
      ENABLE_COMMAND_BLOCK: "false"
      SPAWN_PROTECTION: "16"
      VIEW_DISTANCE: "10"
      MAX_WORLD_SIZE: "10000"
      ALLOW_FLIGHT: "false"

      # Generación del mundo
      LEVEL_TYPE: "DEFAULT" # DEFAULT, FLAT, LARGEBIOMES, AMPLIFIED
      SEED: "" # Semilla del mundo

      # Zona horaria del contenedor
      TZ: "America/Mexico_City"

    volumes:
      # Persistencia: datos del mundo, plugins, configuración
      - minecraft_data:/data
      # Plugins personalizados (solo lectura) — coloca aquí tus .jar adicionales
      - ./plugins:/plugins:ro

    # Healthcheck para saber si el servidor está listo
    healthcheck:
      test: mc-health
      start_period: 60s
      interval: 30s
      timeout: 10s
      retries: 5

    # Límites de recursos (opcional pero recomendado)
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 2G

volumes:
  minecraft_data:
    driver: local

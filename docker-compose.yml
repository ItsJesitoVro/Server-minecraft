services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft-server
    restart: unless-stopped
    ports:
      - "25565:25565"
    environment:
      # Acepta el EULA de Mojang (obligatorio)
      EULA: "TRUE"

      # Tipo de servidor: VANILLA, PAPER, SPIGOT, FABRIC, FORGE
      TYPE: "PAPER"

      # Versión del juego
      VERSION: "26.1.2"

      PLAYER_IDLE_TIMEOUT: "0"

      # Recursos de la JVM
      MEMORY: "5G"
      INIT_MEMORY: "2G"
      USE_AIKAR_FLAGS: "true"

      # ─── Configuración básica del servidor ─────────────────────
      DIFFICULTY: "normal" # peaceful, easy, normal, hard
      MODE: "survival" # survival, creative, adventure, spectator
      MAX_PLAYERS: "10"
      MOTD: "Tilin Server - ¡Bienvenidos a la aventura!" # Mensaje del día
      ONLINE_MODE: "false" # false = modo offline (sin auth de Mojang)
      ALLOW_NETHER: "true"
      ENABLE_COMMAND_BLOCK: "false"
      SPAWN_PROTECTION: "16"
      VIEW_DISTANCE: "10"
      SIMULATION_DISTANCE: "8"
      MAX_WORLD_SIZE: "10000"
      ALLOW_FLIGHT: "false"

      # Generación del mundo
      LEVEL_TYPE: "DEFAULT" # DEFAULT, FLAT, LARGEBIOMES, AMPLIFIED
      SEED: "" # Semilla del mundo

      # Zona horaria del contenedor
      TZ: "America/Mexico_City"

    volumes:
      # Persistencia: datos del mundo, plugins, configuración
      - minecraft_data:/data

    # Healthcheck para saber si el servidor está listo
    healthcheck:
      test: mc-health
      start_period: 60s
      interval: 30s
      timeout: 10s
      retries: 5

    # Límites de recursos (opcional pero recomendado)
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 4G

volumes:
  minecraft_data:
    driver: local
